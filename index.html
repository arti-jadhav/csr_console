<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CreditOne · Service Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0A1826; --ink-2:#10233B; --ink-3:#17314F;
    --bg:#EEF1F5; --card:#FFFFFF; --border:#DCE2E8; --border-soft:#E7EBEF;
    --text:#14202E; --text-2:#5B6B7D; --text-3:#8A97A6;
    --blue:#1D5FA6; --blue-dark:#124478; --blue-tint:#E8F0FA;
    --teal:#0F8C7C; --teal-dark:#0A6558; --teal-tint:#E4F5F2;
    --amber:#C77D0E; --amber-tint:#FBF0DD;
    --red:#C4392B; --red-tint:#FBEAE8;
    --radius:10px;
    --shadow: 0 1px 2px rgba(10,24,38,0.06), 0 4px 16px rgba(10,24,38,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:236px; flex-shrink:0; background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.08);}
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:34px; height:34px; border-radius:8px; background:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:-0.5px;}
  .brand-name{font-size:15px; font-weight:600; line-height:1.2;}
  .brand-sub{font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; letter-spacing:0.02em;}
  .nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,0.68);
    font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--blue); color:#fff;}
  .nav-icon{width:17px; height:17px; flex-shrink:0;}
  .nav-badge{margin-left:auto; background:rgba(255,255,255,0.14); color:#fff; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:20px;}
  .nav-item.active .nav-badge{background:rgba(255,255,255,0.25);}
  .sidebar-footer{padding:14px 20px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:rgba(255,255,255,0.42);}

  /* Main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--border); padding:14px 28px;
    display:flex; align-items:center; gap:18px; position:sticky; top:0; z-index:5;
  }
  .cust-switch{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .cust-switch label{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; white-space:nowrap;}
  select#customerSelect{
    font-family:inherit; font-size:13.5px; font-weight:500; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--text); min-width:260px; max-width:420px;
  }
  .topbar-right{display:flex; align-items:center; gap:16px; margin-left:auto;}
  .agent-chip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2);}
  .agent-avatar{width:28px; height:28px; border-radius:50%; background:var(--blue-tint); color:var(--blue-dark); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;}
  .content{padding:24px 28px 48px; max-width:1180px; width:100%; margin:0 auto;}

  h1.page-title{font-size:20px; font-weight:600; margin:0 0 4px;}
  p.page-sub{font-size:13.5px; color:var(--text-2); margin:0 0 22px;}

  /* Cards & grid */
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
  .stat-label{font-size:11.5px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;}
  .stat-value{font-size:24px; font-weight:600; letter-spacing:-0.3px;}
  .stat-sub{font-size:12px; color:var(--text-2); margin-top:6px;}

  /* Pills */
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; white-space:nowrap;}
  .pill-dot{width:6px; height:6px; border-radius:50%;}
  .pill-active{background:var(--teal-tint); color:var(--teal-dark);} .pill-active .pill-dot{background:var(--teal);}
  .pill-blocked{background:var(--red-tint); color:var(--red);} .pill-blocked .pill-dot{background:var(--red);}
  .pill-restricted{background:var(--amber-tint); color:var(--amber);} .pill-restricted .pill-dot{background:var(--amber);}
  .pill-open{background:var(--amber-tint); color:var(--amber);}
  .pill-inprogress{background:var(--blue-tint); color:var(--blue-dark);}
  .pill-resolved{background:var(--teal-tint); color:var(--teal-dark);}
  .pill-rejected{background:var(--red-tint); color:var(--red);}
  .pill-paid{background:var(--teal-tint); color:var(--teal-dark);}
  .pill-pending{background:var(--amber-tint); color:var(--amber);}
  .pill-overdue{background:var(--red-tint); color:var(--red);}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-3); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border);}
  td{padding:11px 12px; border-bottom:1px solid var(--border-soft); color:var(--text);}
  tr.row-click{cursor:pointer;}
  tr.row-click:hover td{background:#F7F9FB;}
  .table-wrap{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}

  /* Buttons */
  button.btn{font-family:inherit; font-size:13px; font-weight:600; padding:9px 15px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer;}
  button.btn:hover{background:#F5F7F9;}
  button.btn-primary{background:var(--blue); color:#fff; border-color:var(--blue);}
  button.btn-primary:hover{background:var(--blue-dark);}
  button.btn-danger{background:#fff; color:var(--red); border-color:#EAC3BE;}
  button.btn-danger:hover{background:var(--red-tint);}
  button.btn-teal{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.btn-teal:hover{background:var(--teal-dark);}
  button.btn-sm{padding:6px 11px; font-size:12px;}
  button:disabled{opacity:0.45; cursor:not-allowed;}

  input[type=text], input[type=number], select, textarea{
    font-family:inherit; font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text); width:100%;
  }
  label.field-label{font-size:12px; font-weight:600; color:var(--text-2); display:block; margin-bottom:6px;}
  .field{margin-bottom:14px;}

  .section-title{font-size:15px; font-weight:600; margin:28px 0 12px;}
  .section-title:first-child{margin-top:0;}
  .flex-between{display:flex; align-items:center; justify-content:space-between;}
  .muted{color:var(--text-2);}
  .toast{
    position:fixed; bottom:24px; right:28px; background:var(--ink-2); color:#fff; padding:12px 18px; border-radius:9px;
    font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(10,24,38,0.25); display:flex; align-items:center; gap:10px;
    transform:translateY(20px); opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:50;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  .toast-dot{width:8px; height:8px; border-radius:50%; background:var(--teal); flex-shrink:0;}

  /* Health ring */
  .ring-wrap{display:flex; align-items:center; gap:18px;}
  .ring-score{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .ring-band{font-size:12px; font-weight:600; margin-top:2px;}

  .filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-chip{
    font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:#fff; color:var(--text-2); cursor:pointer;
  }
  .filter-chip.active{background:var(--ink-2); color:#fff; border-color:var(--ink-2);}

  .action-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .modal-overlay{position:fixed; inset:0; background:rgba(10,24,38,0.45); display:flex; align-items:center; justify-content:center; z-index:60;}
  .modal{background:#fff; border-radius:12px; padding:22px 24px; width:420px; max-width:92vw; box-shadow:0 20px 60px rgba(10,24,38,0.3);}
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal p.modal-sub{margin:0 0 16px; font-size:12.5px; color:var(--text-2);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

  .profile-hero{display:flex; gap:20px; align-items:flex-start;}
  .avatar-lg{width:56px; height:56px; border-radius:14px; background:var(--blue-tint); color:var(--blue-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; flex-shrink:0;}
  .card-number{font-family:'IBM Plex Mono',monospace; letter-spacing:1px; font-size:14px; color:var(--text-2);}

  @media (max-width: 880px){
    .sidebar{width:64px;}
    .brand-name,.brand-sub,.nav-item span.label,.nav-badge{display:none;}
    .nav-item{justify-content:center;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

function parseDate(str){
  const parts = str.split(" ");
  if(parts.length<3) return TODAY;
  return new Date(parseInt(parts[2],10), MONTH_MAP[parts[1]], parseInt(parts[0],10));
}
function daysAgo(str){ return Math.round((TODAY - parseDate(str)) / (1000*60*60*24)); }

const STORAGE_KEY = "creditone_console_state_v1";
const hasStorage = typeof window.storage !== "undefined";
async function persistState(){
  if(!hasStorage) return;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      customers: state.customers, auditLog: state.auditLog, ticketSeq, logSeq
    }), false);
  }catch(e){ console.warn("Storage save skipped:", e); }
}
async function hydrateState(){
  if(!hasStorage) return;
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      if(data.customers) state.customers = data.customers;
      if(data.auditLog) state.auditLog = data.auditLog;
      if(data.ticketSeq) ticketSeq = data.ticketSeq;
      if(data.logSeq) logSeq = data.logSeq;
    }
  }catch(e){ /* no saved state yet — fine, keep sample data */ }
}
async function resetSampleData(){
  if(hasStorage){ try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){} }
  location.reload();
}

const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const getCustomer = id => state.customers.find(c=>c.id===id);

function statusPillClass(s){
  return {Active:"pill-active", Blocked:"pill-blocked", Restricted:"pill-restricted"}[s] || "pill-active";
}
function ticketPillClass(s){
  return {Open:"pill-open","In Progress":"pill-inprogress", Resolved:"pill-resolved", Rejected:"pill-rejected"}[s] || "pill-open";
}
function statementPillClass(s){
  return {Paid:"pill-paid", Pending:"pill-pending", Overdue:"pill-overdue"}[s] || "pill-pending";
}
function scoreBand(score){
  if(score>=750) return {label:"Excellent", color:"var(--teal)"};
  if(score>=700) return {label:"Good", color:"var(--blue)"};
  if(score>=650) return {label:"Fair", color:"var(--amber)"};
  return {label:"Needs attention", color:"var(--red)"};
}
function showToast(msg){
  const t=document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

function ringSvg(score, color){
  const pct = Math.min(100, Math.max(0, ((score-300)/(900-300))*100));
  const r=26, c=2*Math.PI*r, offset = c - (pct/100)*c;
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 32 32)"/>
  </svg>`;
}

function toggleBlock(id){
  const c = getCustomer(id);
  const wasBlocked = c.status==="Blocked";
  c.status = wasBlocked ? "Active" : "Blocked";
  c.tickets.unshift({
    id: nextTicketId(), type:"Card Status", subject: wasBlocked?"Card unblocked by agent":"Card blocked by agent",
    description: wasBlocked?"Card reinstated after verification with cardholder.":"Card blocked as a precaution per cardholder request or risk flag.",
    status:"Resolved", created: today(), updated: today()
  });
  addAudit(wasBlocked?"Card unblocked":"Card blocked", c, wasBlocked?"Card reinstated after verification with cardholder.":"Card blocked as a precaution per cardholder request or risk flag.");
  showToast(wasBlocked ? "Card unblocked" : "Card blocked");
  render();
}

function ticketTable(tickets, showActions){
  if(tickets.length===0) return `<div class="table-wrap" style="padding:24px; text-align:center;" class="muted">No tickets in this view.</div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Ticket</th><th>Type</th><th>Subject</th><th>Status</th><th>Updated</th>${showActions?"<th></th>":""}</tr></thead>
    <tbody>
      ${tickets.map(t=>`<tr>
        <td class="mono">${t.id}</td>
        <td>${t.type}</td>
        <td>${t.subject}<br/><span class="muted" style="font-size:12px;">${t.description}</span></td>
        <td><span class="pill ${ticketPillClass(t.status)}"><span class="pill-dot"></span>${t.status}</span></td>
        <td class="muted" style="font-size:12.5px;">${t.updated}</td>
        ${showActions?`<td>${ticketActionButtons(t)}</td>`:""}
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}
function ticketActionButtons(t){
  if(t.status==="Open") return `<button class="btn btn-sm" onclick="advanceTicket('${t.id}','In Progress')">Start progress</button>`;
  if(t.status==="In Progress") return `<button class="btn btn-sm btn-teal" onclick="advanceTicket('${t.id}','Resolved')">Mark resolved</button>`;
  return "";
}
function advanceTicket(ticketId, newStatus){
  const c = selected();
  const t = c.tickets.find(x=>x.id===ticketId);
  t.status = newStatus; t.updated = today();
  addAudit("Ticket status updated", c, `${ticketId} (${t.type}) moved to ${newStatus}`);
  showToast(`Ticket ${ticketId} moved to ${newStatus}`);
  renderContent();
}
function raiseTicket(customerId){
  const type = document.getElementById("newTicketType").value;
  const subject = document.getElementById("newTicketSubject").value.trim();
  const desc = document.getElementById("newTicketDesc").value.trim();
  if(!subject){ showToast("Enter a subject before submitting"); return; }
  const c = getCustomer(customerId);
  c.tickets.unshift({id: nextTicketId(), type, subject, description: desc || "No additional details provided.", status:"Open", created: today(), updated: today()});
  addAudit("Ticket raised", c, `${type}: ${subject}`);
  showToast("Ticket submitted");
  renderContent();
}

/* ============================= CREDIT SCORE TRACKER ============================= */
function renderScore(){
  const c = selected();
  const latest = c.scoreHistory[c.scoreHistory.length-1].score;
  const first = c.scoreHistory[0].score;
  const delta = latest-first;
  const band = scoreBand(latest);
  return `
    <h1 class="page-title">Credit score tracker</h1>
    <p class="page-sub">Monthly score movement for ${c.name}, over the last 12 months.</p>

    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="card"><div class="stat-label">Current score</div><div class="stat-value mono" style="color:${band.color};">${latest}</div><div class="stat-sub">${band.label}</div></div>
      <div class="card"><div class="stat-label">12-month change</div><div class="stat-value mono" style="color:${delta>=0?'var(--teal)':'var(--red)'};">${delta>=0?"+":""}${delta}</div><div class="stat-sub">vs. ${c.scoreHistory[0].month}</div></div>
      <div class="card"><div class="stat-label">Next update</div><div class="stat-value">28 Aug 2026</div><div class="stat-sub">Monthly bureau refresh</div></div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="stat-label" style="margin-bottom:10px;">Score trend</div>
      <div style="position:relative; height:260px;">
        <canvas id="scoreChart" role="img" aria-label="Line chart of ${c.name}'s credit score over 12 months, from ${first} to ${latest}"></canvas>
      </div>
    </div>

    <h2 class="section-title">Contributing factors</h2>
    <div class="grid grid-2">
      ${c.scoreFactors.map(f=>`
        <div class="card">
          <div class="flex-between" style="margin-bottom:8px;">
            <span style="font-size:13.5px; font-weight:600;">${f.label}</span>
            <span class="mono" style="font-size:13px; color:var(--text-2);">${f.pct}/100</span>
          </div>
          <div style="height:6px; background:var(--border-soft); border-radius:4px; overflow:hidden;">
            <div style="height:100%; width:${f.pct}%; background:${f.pct>=70?'var(--teal)':f.pct>=45?'var(--amber)':'var(--red)'};"></div>
          </div>
          <div class="muted" style="font-size:12.5px; margin-top:8px;">${f.detail}</div>
        </div>
      `).join("")}
    </div>

    <h2 class="section-title">Monthly history</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Month</th><th>Score</th><th>Band</th></tr></thead>
      <tbody>
        ${c.scoreHistory.slice().reverse().map(h=>{
          const b = scoreBand(h.score);
          return `<tr><td>${h.month}</td><td class="mono">${h.score}</td><td><span style="color:${b.color}; font-weight:600; font-size:12.5px;">${b.label}</span></td></tr>`;
        }).join("")}
      </tbody>
    </table></div>
  `;
}

let scoreChartInstance = null;
function drawScoreChart(){
  const c = selected();
  const ctx = document.getElementById("scoreChart");
  if(!ctx) return;
  if(scoreChartInstance) scoreChartInstance.destroy();
  scoreChartInstance = new Chart(ctx, {
    type:"line",
    data:{
      labels: c.scoreHistory.map(h=>h.month),
      datasets:[{
        label:"Credit score",
        data: c.scoreHistory.map(h=>h.score),
        borderColor:"#1D5FA6",
        backgroundColor:"rgba(29,95,166,0.08)",
        pointBackgroundColor:"#1D5FA6",
        pointRadius:3,
        borderWidth:2,
        fill:true,
        tension:0.3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label: ctx=>"Score: "+ctx.parsed.y}} },
      scales:{
        y:{ min:300, max:900, grid:{color:"#E7EBEF"}, ticks:{color:"#8A97A6", stepSize:100} },
        x:{ grid:{display:false}, ticks:{color:"#8A97A6", maxRotation:45, autoSkip:false, font:{size:10}} }
      }
    }
  });
}

/* ============================= CASHBACK & REWARDS ============================= */
function renderCashback(){
  const c = selected();
  return `
    <h1 class="page-title">Cashback & rewards</h1>
    <p class="page-sub">Rewards balance and transaction ledger for ${c.name}.</p>

    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="card"><div class="stat-label">Available cashback</div><div class="stat-value">${inr(c.cashback.available)}</div></div>
      <div class="card"><div class="stat-label">Earned this year</div><div class="stat-value">${inr(c.cashback.earnedYTD)}</div></div>
      <div class="card"><div class="stat-label">Redeemed this year</div><div class="stat-value">${inr(c.cashback.redeemedYTD)}</div></div>
      <div class="card"><div class="stat-label">Reward rate</div><div class="stat-value" style="font-size:15px; line-height:1.4;">${c.cashback.rate}</div></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="flex-between">
        <div>
          <div class="stat-label" style="margin-bottom:4px;">Redeem cashback</div>
          <div class="muted" style="font-size:12.5px;">Redeem as a statement credit against the current balance.</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="number" id="redeemAmount" placeholder="Amount" style="width:130px;" min="1" max="${c.cashback.available}"/>
          <button class="btn btn-teal" onclick="redeemCashback('${c.id}')" ${c.cashback.available<=0?"disabled":""}>Redeem</button>
        </div>
      </div>
    </div>

    <h2 class="section-title">Redemption history</h2>
    <div class="filter-row">
      <button class="filter-chip ${state.rewardsRange==='30'?'active':''}" onclick="setRewardsRange('30')">Last 30 days</button>
      <button class="filter-chip ${state.rewardsRange==='60'?'active':''}" onclick="setRewardsRange('60')">Last 60 days</button>
      <button class="filter-chip ${state.rewardsRange==='statement'?'active':''}" onclick="setRewardsRange('statement')">Since last statement</button>
    </div>
    ${renderRedemptionWindow(c)}

    <h2 class="section-title">Full transaction ledger</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Spend</th><th>Cashback</th></tr></thead>
      <tbody>
        ${c.cashback.transactions.map(t=>`<tr>
          <td>${t.date}</td><td>${t.merchant}</td><td>${t.category}</td>
          <td class="mono">${t.spend>0?inr(t.spend):"—"}</td>
          <td class="mono" style="color:${t.cashback<0?'var(--red)':'var(--teal-dark)'}; font-weight:600;">${t.cashback<0?"− "+inr(Math.abs(t.cashback)):"+ "+inr(t.cashback)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  `;
}
function renderRedemptionWindow(c){
  const redemptions = c.cashback.transactions.filter(t=>t.type==="Redeemed");
  let windowLabel, filtered;
  if(state.rewardsRange==="30"){
    windowLabel = "in the last 30 days";
    filtered = redemptions.filter(t=>daysAgo(t.date)<=30);
  } else if(state.rewardsRange==="60"){
    windowLabel = "in the last 60 days";
    filtered = redemptions.filter(t=>daysAgo(t.date)<=60);
  } else {
    windowLabel = `since the last statement (${c.statementDate})`;
    const statementDate = parseDate(c.statementDate);
    filtered = redemptions.filter(t=>parseDate(t.date) >= statementDate);
  }
  const total = filtered.reduce((a,t)=>a+Math.abs(t.cashback),0);
  return `
    <div class="card" style="margin-bottom:14px;">
      <div class="flex-between">
        <div class="stat-label" style="margin-bottom:0;">Redeemed ${windowLabel}</div>
        <div class="mono" style="font-size:15px; font-weight:600; color:var(--teal-dark);">${inr(total)}</div>
      </div>
    </div>
    ${filtered.length===0 ? `<div class="table-wrap" style="padding:20px; text-align:center;"><span class="muted">No redemptions recorded ${windowLabel}.</span></div>` : `
    <div class="table-wrap" style="margin-bottom:20px;"><table>
      <thead><tr><th>Date</th><th>Redemption type</th><th>Amount</th></tr></thead>
      <tbody>
        ${filtered.map(t=>`<tr>
          <td>${t.date}</td><td>${t.merchant}</td>
          <td class="mono" style="color:var(--red); font-weight:600;">− ${inr(Math.abs(t.cashback))}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>`}
  `;
}
function setRewardsRange(range){ state.rewardsRange = range; renderContent(); }
function redeemCashback(id){
  const c = getCustomer(id);
  const input = document.getElementById("redeemAmount");
  const amt = parseInt(input.value,10);
  if(!amt || amt<=0){ showToast("Enter a valid amount"); return; }
  if(amt>c.cashback.available){ showToast("Amount exceeds available cashback"); return; }
  c.cashback.available -= amt;
  c.cashback.redeemedYTD += amt;
  c.cashback.transactions.unshift({date: today(), merchant:"Statement Credit", category:"Redemption", spend:0, cashback:-amt, type:"Redeemed"});
  addAudit("Cashback redeemed", c, `${inr(amt)} redeemed as statement credit`);
  showToast(inr(amt)+" redeemed as statement credit");
  renderContent();
}

/* ============================= BILLING & STATEMENTS ============================= */
function renderBilling(){
  const c = selected();
  return `
    <h1 class="page-title">Billing & statements</h1>
    <p class="page-sub">Current dues and statement history for ${c.name}.</p>

    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="card"><div class="stat-label">Statement date</div><div class="stat-value" style="font-size:16px;">${c.statementDate}</div></div>
      <div class="card"><div class="stat-label">Payment due date</div><div class="stat-value" style="font-size:16px;">${c.dueDate}</div></div>
      <div class="card"><div class="stat-label">Total due</div><div class="stat-value">${inr(c.totalDue)}</div></div>
      <div class="card"><div class="stat-label">Minimum due</div><div class="stat-value">${inr(c.minDue)}</div></div>
    </div>

    <h2 class="section-title">Statement history</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Statement month</th><th>Total due</th><th>Min due</th><th>Paid amount</th><th>Paid date</th><th>Status</th></tr></thead>
      <tbody>
        ${c.statements.map(s=>`<tr>
          <td>${s.month}</td><td class="mono">${inr(s.totalDue)}</td><td class="mono">${inr(s.minDue)}</td>
          <td class="mono">${s.paidAmount>0?inr(s.paidAmount):"—"}</td><td>${s.paidDate}</td>
          <td><span class="pill ${statementPillClass(s.status)}"><span class="pill-dot"></span>${s.status}</span></td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  `;
}

/* ============================= AUDIT LOG ============================= */
function renderAuditLog(){
  const agentNames = ["All", ...AGENTS.map(a=>a.name)];
  const actionTypes = ["All", ...Array.from(new Set(state.auditLog.map(l=>l.action)))];
  let list = state.auditLog;
  if(state.auditAgentFilter!=="All") list = list.filter(l=>l.agent===state.auditAgentFilter);
  if(state.auditActionFilter!=="All") list = list.filter(l=>l.action===state.auditActionFilter);

  return `
    <h1 class="page-title">Audit log</h1>
    <p class="page-sub">Every action taken across all accounts, in chronological order.</p>

    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="field" style="margin-bottom:0;">
        <label class="field-label">Filter by agent</label>
        <select onchange="setAuditFilter('agent', this.value)">
          ${agentNames.map(n=>`<option value="${n}" ${state.auditAgentFilter===n?"selected":""}>${n}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label class="field-label">Filter by action type</label>
        <select onchange="setAuditFilter('action', this.value)">
          ${actionTypes.map(n=>`<option value="${n}" ${state.auditActionFilter===n?"selected":""}>${n}</option>`).join("")}
        </select>
      </div>
    </div>

    ${list.length===0 ? `<div class="table-wrap" style="padding:24px; text-align:center;"><span class="muted">No activity recorded yet — actions taken in the console will appear here.</span></div>` : `
    <div class="table-wrap"><table>
      <thead><tr><th>Timestamp</th><th>Agent</th><th>Customer</th><th>Action</th><th>Details</th></tr></thead>
      <tbody>
        ${list.map(l=>`<tr>
          <td class="mono" style="white-space:nowrap; font-size:12px;">${l.timestamp}</td>
          <td>${l.agent}</td>
          <td>${l.customerName}${l.customerId?`<br/><span class="muted" style="font-size:11.5px;">${l.customerId}</span>`:""}</td>
          <td>${l.action}</td>
          <td class="muted" style="font-size:12.5px;">${l.details}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>`}
  `;
}
function setAuditFilter(kind, value){
  if(kind==="agent") state.auditAgentFilter = value; else state.auditActionFilter = value;
  renderContent();
}

/* ============================= MODALS ============================= */
function openModal(kind){
  const c = selected();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  if(kind==="replace"){
    overlay.innerHTML = `<div class="modal">
      <h3>Request card replacement</h3>
      <p class="modal-sub">A new physical card will be issued for ${c.name}'s ${c.cardType}.</p>
      <div class="field"><label class="field-label">Reason</label>
        <select id="replaceReason"><option>Lost card</option><option>Stolen card</option><option>Damaged card</option><option>Expiring soon</option></select>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitReplacement('${c.id}')">Submit request</button>
      </div>
    </div>`;
  } else {
    overlay.innerHTML = `<div class="modal">
      <h3>Request limit increase</h3>
      <p class="modal-sub">Submit a request for underwriting review. Current limit: ${inr(c.creditLimit)}.</p>
      <div class="field"><label class="field-label">Requested new limit</label>
        <input type="number" id="limitAmount" placeholder="e.g. ${c.creditLimit + 100000}"/>
      </div>
      <div class="field"><label class="field-label">Reason</label>
        <textarea id="limitReason" rows="2" placeholder="Reason for the request"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitLimitIncrease('${c.id}')">Submit request</button>
      </div>
    </div>`;
  }
  document.body.appendChild(overlay);
}
function closeModal(){
  const el = document.getElementById("modalOverlay");
  if(el) el.remove();
}
function submitReplacement(id){
  const reason = document.getElementById("replaceReason").value;
  const c = getCustomer(id);
  c.tickets.unshift({id: nextTicketId(), type:"Card Replacement", subject:"Replacement requested — "+reason, description:"Agent-initiated replacement request. New card will be dispatched to the registered address.", status:"Open", created: today(), updated: today()});
  addAudit("Card replacement requested", c, reason);
  closeModal();
  showToast("Replacement request submitted");
  renderContent();
}
function submitLimitIncrease(id){
  const amount = document.getElementById("limitAmount").value;
  const reason = document.getElementById("limitReason").value.trim();
  const c = getCustomer(id);
  c.tickets.unshift({id: nextTicketId(), type:"Limit Increase", subject:"Requested new limit of "+(amount?inr(amount):"—"), description: reason || "No additional reason provided.", status:"Open", created: today(), updated: today()});
  addAudit("Limit increase requested", c, `New limit requested: ${amount?inr(amount):"—"}. Reason: ${reason||"—"}`);
  closeModal();
  showToast("Limit increase request submitted");
  renderContent();
}

/* ============================= INIT ============================= */
(async function init(){
  await hydrateState();
  render();
})();
</script>
</body>
</html>
